services:
  postgres:
    image: postgres:16-alpine
    container_name: esqueleto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-esqueleto}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-esqueleto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - esqueleto-network
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    container_name: esqueleto-storefront
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-esqueleto}
      - HOST=0.0.0.0
      - PORT=4321
    env_file:
      - path: .env
        required: false
    volumes:
      - ./uploads:/app/uploads
    networks:
      - esqueleto-network
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: esqueleto-admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-esqueleto}
      - UPLOADS_DIR=/app/uploads
      - HOSTNAME=0.0.0.0
      - PORT=3001
    env_file:
      - path: .env
        required: false
    volumes:
      - ./uploads:/app/uploads
    networks:
      - esqueleto-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: esqueleto-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - storefront
      - admin
    networks:
      - esqueleto-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  esqueleto-network:
    name: esqueleto-network
    driver: bridge
